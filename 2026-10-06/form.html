<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular_JI</title>
</head>
<body>
    <h1>Formular</h1>
    <form action="mailto:JI220083@spengergasse.at?subject=Kontaktformular" method="post" enctype="text/plain">
        <label for="vorname">Vorname:</label>
        <input type="text" name="vorname">
        <label for="nachname">Nachname:</label>
        <input type="text" name="nachname">
        <br>
        <p>Geschlecht:</p>
        <label for="geschlecht">Weiblich</label>
        <input type="radio" name="geschlecht" value="weiblich"><br>
        <label for="geschlecht">Männlich</label>
        <input type="radio" name="geschlecht" value="maennlich"><br>
        <label for="geschlecht">Divers</label>
        <input type="radio" name="geschlecht" value="divers">
        <br>
        <br>
        <label for="buchstabe">Lieblingsbuchstabe:</label>
        <select name="buchstabe">
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
        </select>
        <br><br>
        <label for="hobby">Hobbys:</label>
        <select name="hobby" multiple>
            <option value="schwimmen">Schwimmen</option>
            <option value="laufen">Laufen</option>
            <option value="lesen">Lesen</option>
        </select>
        <br>
        <p>Wie zufrieden bist du mit dem Formular? Schreibe gerne deinen Kommentar:</p>
        <textarea name="kommentar" placeholder="Kommentar"></textarea>
        <br>
        <input type="submit" value="Absenden">
        <input type="reset" value="Zurücksetzen">
    </form>
</body>
</html>
